services:
  api:
    build:
      # Repo root — the pnpm workspace needs api-types in context.
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: pocket-teach-api
    env_file: .env
    environment:
      PORT: ${PORT:-8787}
    ports:
      - '${PORT:-8787}:${PORT:-8787}'
    volumes:
      # Persist the git-backed project workspaces across restarts (ADR 0001).
      - ./data:/app/apps/api/data
    restart: unless-stopped
