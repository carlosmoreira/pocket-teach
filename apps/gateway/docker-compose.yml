services:
  gateway:
    build:
      # Repo root — the pnpm workspace needs api-types in context.
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    image: pocket-teach-gateway
    env_file: .env
    environment:
      PORT: ${PORT:-8787}
    ports:
      - '${PORT:-8787}:${PORT:-8787}'
    volumes:
      # Persist the backup blob store across restarts.
      - ./data:/app/apps/gateway/data
    restart: unless-stopped
